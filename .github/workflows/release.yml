name: Release

# On main, two steps. While changesets are pending, Changesets opens (or
# updates) a "chore: release" pull request: version bump + CHANGELOG. Once it
# is merged, and the maintainer approves the run in the `npm` environment,
# the new version is staged on npm with provenance: it only becomes
# installable once the maintainer approves it on npm too, with 2FA (npm's
# trusted publisher only allows staged publishing).
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.changesets.outputs.hasChangesets == 'false' && steps.npm.outputs.published == 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Before Changesets switches to its release branch: is the version on
      # main already on npm?
      - name: Is this version on npm?
        id: npm
        run: |
          version=$(node -p "require('./packages/steerkit/package.json').version")
          if npm view "steerkit@$version" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the release pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Waits for the maintainer's approval; npm's trusted publisher is tied to
    # this environment
    environment: npm
    permissions:
      contents: write
      # npm trusted publishing (OIDC) and provenance
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15 or later
      - run: npm install --global npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Stage the new version on npm
        working-directory: packages/steerkit
        run: npm stage publish --provenance --access public

      # A draft, published by hand once the staged version is approved on npm
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/steerkit/package.json').version")
          awk -v heading="## $version" '$0 == heading { on = 1; next } /^## / && on { exit } on' \
            packages/steerkit/CHANGELOG.md > notes.md
          gh release create "steerkit@$version" --draft --target "$GITHUB_SHA" \
            --title "steerkit $version" --notes-file notes.md
