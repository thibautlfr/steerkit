name: Release

# On main, Changesets either opens a "Version Packages" pull request from the
# pending changesets (version bump + CHANGELOG), or, once that pull request
# is merged, publishes the new version to npm with provenance.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing (OIDC) and provenance
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
