name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The library itself runs anywhere; these are the Node versions its
        # tooling is checked on (LTS and current)
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # Version from the packageManager field of package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome ci

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Size budget
        run: pnpm -F steerkit size

      - name: Package exports and types
        run: pnpm -F steerkit check:package
